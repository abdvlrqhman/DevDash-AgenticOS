<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DevDash</title>
  <style>
    /* Self-contained launch UI. Tokens mirror apps/web (shadcn/ui neutral). */
    @font-face {
      font-family: "Geist";
      src: url("fonts/geist-latin-wght-normal.woff2") format("woff2-variations");
      font-weight: 100 900;
      font-display: swap;
    }

    :root {
      --background: #fafafa; --card: #ffffff; --foreground: #0a0a0a; --muted-foreground: #737373;
      --border: #e5e5e5; --primary: #171717; --primary-foreground: #fafafa; --ring: #a3a3a3;
      --destructive: #dc2626; --logo-bg: #171717; --accent: #e3b45a;
      --track: #0000000f; --card-shadow: 0 1px 2px #0000000d; --glow: #17171714;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --background: #0a0a0a; --card: #171717; --foreground: #fafafa; --muted-foreground: #a3a3a3;
        --border: #ffffff1a; --primary: #e5e5e5; --primary-foreground: #171717; --ring: #737373;
        --destructive: #f87171; --logo-bg: #404040; --accent: #e3b45a;
        --track: #ffffff14; --card-shadow: 0 1px 2px #00000040; --glow: #e3b45a1f;
        color-scheme: dark;
      }
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--background);
      background-image: radial-gradient(120% 60% at 50% -10%, var(--glow), transparent 70%);
      color: var(--foreground);
      font: 14px/1.5 "Geist", system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex; flex-direction: column;
      min-height: 100dvh;
    }

    main {
      width: 100%; max-width: 384px; margin: auto;
      display: flex; flex-direction: column; align-items: stretch; gap: 28px;
      padding: max(40px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-left))
               max(28px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-right));
      animation: enter .5s cubic-bezier(.16,.84,.44,1) both;
    }
    @keyframes enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    /* ---- Logo ---- */
    .logo {
      align-self: center; width: 60px; height: 60px; border-radius: 15px;
      filter: drop-shadow(0 10px 28px color-mix(in srgb, var(--logo-bg) 28%, transparent));
    }

    /* ---- Shared text ---- */
    .head { text-align: center; display: flex; flex-direction: column; gap: 6px; }
    h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.25; margin: 0; }
    #opening-name { white-space: nowrap; }
    h2 {
      font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
      color: var(--muted-foreground); margin: 0 0 10px 2px;
    }
    p { margin: 0; }
    .muted { color: var(--muted-foreground); }

    section, form { display: flex; flex-direction: column; gap: 20px; }

    /* ---- Opening (launch) state ---- */
    #opening { align-items: center; gap: 22px; }
    #opening-host {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 4px 11px; border: 1px solid var(--border); border-radius: 999px;
      font-size: 13px; color: var(--muted-foreground); background: var(--card);
    }
    #opening-host::before {
      content: ""; width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
    }

    /* Indeterminate loading shimmer */
    .loader {
      position: relative; width: 168px; height: 4px; border-radius: 999px;
      background: var(--track); overflow: hidden;
    }
    .loader::after {
      content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 42%; border-radius: inherit;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      animation: shimmer 1.25s cubic-bezier(.65,.05,.36,1) infinite;
    }
    @keyframes shimmer { 0% { transform: translateX(-120%); } 100% { transform: translateX(300%); } }

    /* ---- Connect state ---- */
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px;
      display: flex; flex-direction: column; gap: 16px; box-shadow: var(--card-shadow);
    }
    .field { display: flex; flex-direction: column; gap: 8px; }
    label { font-size: 14px; font-weight: 500; }
    input {
      height: 44px; width: 100%; border: 1px solid var(--border); border-radius: 10px;
      background: transparent; color: var(--foreground); padding: 0 13px;
      font: 16px "Geist", system-ui, sans-serif; outline: none;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    input::placeholder { color: var(--muted-foreground); }
    input:focus-visible {
      border-color: var(--ring);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--ring) 35%, transparent);
    }

    button {
      height: 44px; border: 0; border-radius: 10px; background: var(--primary); color: var(--primary-foreground);
      font: 600 14px "Geist", system-ui, sans-serif; cursor: pointer;
      transition: filter .15s ease, transform .08s ease, opacity .15s ease;
    }
    button:hover:not(:disabled) { filter: brightness(1.08); }
    button:active:not(:disabled) { transform: translateY(1px); }
    button:disabled { opacity: .55; cursor: default; }

    /* "Use a different space" — quiet secondary affordance */
    #cancel {
      height: auto; align-self: center; background: none; color: var(--muted-foreground);
      font-weight: 500; padding: 8px 10px; border-radius: 8px; text-decoration: none;
    }
    #cancel:hover { color: var(--foreground); filter: none; }

    #error {
      color: var(--destructive); border: 1px solid color-mix(in srgb, var(--destructive) 40%, var(--border));
      border-radius: 10px; padding: 10px 12px; font-size: 14px;
      background: color-mix(in srgb, var(--destructive) 7%, var(--card));
    }

    /* Recent spaces */
    #recent-wrap { margin-top: 4px; }
    ul {
      list-style: none; margin: 0; padding: 0; border: 1px solid var(--border);
      border-radius: 14px; overflow: hidden; background: var(--card); box-shadow: var(--card-shadow);
    }
    li + li { border-top: 1px solid var(--border); }
    .space {
      position: relative; width: 100%; height: auto; background: none; color: var(--foreground);
      text-align: left; padding: 13px 40px 13px 15px; border-radius: 0; font-weight: 400;
      display: flex; flex-direction: column; gap: 2px;
    }
    .space:hover { background: color-mix(in srgb, var(--foreground) 5%, transparent); filter: none; }
    .space::after {
      content: ""; position: absolute; right: 17px; top: 50%;
      width: 7px; height: 7px; border-right: 1.5px solid var(--muted-foreground);
      border-top: 1.5px solid var(--muted-foreground); transform: translateY(-50%) rotate(45deg);
      opacity: .6;
    }
    .space .name { font-weight: 500; font-size: 14px; }
    .space .host { color: var(--muted-foreground); font-size: 13px; }

    :focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }

    @media (prefers-reduced-motion: reduce) {
      main { animation: none; }
      .loader::after { animation-duration: 2.4s; }
      button:active:not(:disabled) { transform: none; }
    }
  </style>
</head>
<body>
  <main>
    <svg class="logo" width="60" height="60" viewBox="0 0 64 64" aria-label="DevDash" role="img">
      <rect width="64" height="64" rx="15" fill="var(--logo-bg)"/>
      <g fill="#F5F5F5">
        <rect x="31" y="7.5" width="11" height="11" rx="1.6"/><rect x="44" y="7.5" width="11" height="11" rx="1.6"/>
        <rect x="44" y="20.5" width="11" height="11" rx="1.6"/><rect x="44" y="33.5" width="11" height="11" rx="1.6"/>
        <rect x="5" y="46.5" width="11" height="11" rx="1.6"/><rect x="18" y="46.5" width="11" height="11" rx="1.6"/>
        <rect x="31" y="46.5" width="11" height="11" rx="1.6"/><rect x="44" y="46.5" width="11" height="11" rx="1.6"/>
      </g>
      <rect x="18" y="20.5" width="11" height="24" rx="1.6" fill="#E3B45A"/>
    </svg>

    <section id="opening" hidden>
      <div class="head">
        <h1>Opening <span id="opening-name"></span></h1>
      </div>
      <p class="muted" id="opening-host"></p>
      <div class="loader" role="progressbar" aria-label="Opening your space"></div>
      <button type="button" id="cancel">Use a different space</button>
    </section>

    <form id="connect" hidden novalidate>
      <div class="head">
        <h1>Connect to your space</h1>
        <p class="muted">Enter the address your team uses, for example dev.example.com.</p>
      </div>
      <div class="card">
        <div class="field">
          <label for="host">Space address</label>
          <input id="host" name="host" inputmode="url" autocapitalize="none" autocomplete="url" spellcheck="false" placeholder="dev.example.com" required>
        </div>
        <p id="error" role="alert" hidden></p>
        <button type="submit" id="submit">Connect</button>
      </div>
      <div id="recent-wrap" hidden>
        <h2>Recent</h2>
        <ul id="recent"></ul>
      </div>
    </form>
  </main>
  <script src="updater.js"></script>
  <script src="connect.js"></script>
</body>
</html>
