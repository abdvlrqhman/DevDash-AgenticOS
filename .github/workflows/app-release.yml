name: App release

# Builds the native DevDash app (apps/shell) and attaches installers to a GitHub release.
# Trigger: push a tag like app-v0.1.0, or run manually with a version.
on:
  push:
    tags: ['app-v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version (e.g. 0.1.0)
        required: true
      platforms:
        description: Which apps to build
        default: windows,android,ios

permissions:
  contents: write

env:
  TAG: ${{ github.event_name == 'push' && github.ref_name || format('app-v{0}', inputs.version) }}

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Create the release if needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "DevDash app ${TAG#app-v}" --notes "$(cat <<'EOF'
          Install the app, then enter your space address (for example dev.example.com).

          - **Windows:** `DevDash_*_x64-setup.exe`
          - **Android:** `DevDash-*.apk` (allow installs from your browser or files app)
          - **iPhone / iPad:** `DevDash-*.ipa` when this release is signed (notifications even when the app is closed; for the iPhones in its provisioning profile, or through TestFlight), otherwise `DevDash-*-unsigned.ipa` for AltStore or SideStore (notifications only while it's open). Or open your space in Safari and use Share, Add to Home Screen.
          EOF
          )"

  windows:
    needs: release
    if: contains(inputs.platforms || 'windows,android,ios', 'windows')
    runs-on: windows-latest
    defaults: { run: { working-directory: apps/shell } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: { workspaces: apps/shell/src-tauri }
      - run: npm ci --no-fund --no-audit
      - name: Build (with updater signing)
        env:
          # Signs the updater artifacts (bundle.createUpdaterArtifacts) → *-setup.exe.sig / *.msi.sig.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build
      - name: Upload installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.sig
          )
          gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"

  android:
    needs: release
    if: contains(inputs.platforms || 'windows,android,ios', 'android')
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: apps/shell } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with: { distribution: temurin, java-version: 17 }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: { workspaces: apps/shell/src-tauri }
      - run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
      - run: npm ci --no-fund --no-audit
      - name: Build APK
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npx tauri android init --ci
          npx tauri icon app-icon.png
          bash android/prepare.sh
          npx tauri android build --apk --ci
      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          unsigned=$(find src-tauri/gen/android/app/build/outputs/apk -name '*universal*release*.apk' | head -1)
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          "$tools/zipalign" -f -p 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KS_PASS --ks-key-alias devdash \
            --out "$RUNNER_TEMP/DevDash-${TAG#app-v}.apk" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify "$RUNNER_TEMP/DevDash-${TAG#app-v}.apk"
          rm "$RUNNER_TEMP/release.jks"
      - name: Sign APK for the updater
        # The updater plugin is desktop-only, so `tauri build` emits no .sig on Android. We sign the
        # final (store-signed) APK by hand so latest.json can carry an Android entry too.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          apk="$RUNNER_TEMP/DevDash-${TAG#app-v}.apk"
          npx tauri signer sign --app-version "${TAG#app-v}" "$apk"
          ls -la "$apk.sig"
      - name: Upload APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$RUNNER_TEMP/DevDash-${TAG#app-v}.apk" "$RUNNER_TEMP/DevDash-${TAG#app-v}.apk.sig" --clobber --repo "$GITHUB_REPOSITORY"

  ios:
    needs: release
    if: contains(inputs.platforms || 'windows,android,ios', 'ios')
    runs-on: macos-15
    defaults: { run: { working-directory: apps/shell } }
    env:
      # Signing. With all three, the IPA is signed and gets notifications while the app is
      # closed; the provisioning profile decides development, ad hoc or App Store. Without them, the unsigned IPA.
      IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
      # Optional, App Store profiles only: an App Store Connect API key (not the APNs key) to send the build to TestFlight.
      APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: { workspaces: apps/shell/src-tauri }
      - run: rustup target add aarch64-apple-ios
      - run: npm ci --no-fund --no-audit
      - name: Build unsigned IPA (sideload with AltStore or SideStore)
        if: env.IOS_CERTIFICATE == '' || env.IOS_CERTIFICATE_PASSWORD == '' || env.IOS_MOBILE_PROVISION == ''
        run: |
          unset IOS_CERTIFICATE IOS_CERTIFICATE_PASSWORD IOS_MOBILE_PROVISION
          npx tauri ios init --ci
          npx tauri icon app-icon.png
          npx tauri ios build --no-sign --ci
          out="$RUNNER_TEMP/DevDash-${TAG#app-v}-unsigned.ipa"
          ipa=$(find src-tauri/gen/apple/build -name '*.ipa' | head -1)
          if [ -n "$ipa" ]; then cp "$ipa" "$out"; else
            # No IPA exported without signing: package the built .app the way an IPA is laid out.
            app=$(find src-tauri/gen/apple/build -maxdepth 6 -type d -path '*.xcarchive/Products/Applications/*.app' | head -1)
            [ -n "$app" ] || app=$(find src-tauri/gen/apple/build -name '*.app' -type d | head -1)
            [ -n "$app" ] || { echo "no .app found"; find src-tauri/gen/apple/build -maxdepth 4; exit 1; }
            mkdir -p "$RUNNER_TEMP/pkg/Payload" && cp -R "$app" "$RUNNER_TEMP/pkg/Payload/"
            (cd "$RUNNER_TEMP/pkg" && zip -qry "$out" Payload)
          fi
          ls -la "$out"
      - name: Build signed IPA (notifications while the app is closed)
        if: env.IOS_CERTIFICATE != '' && env.IOS_CERTIFICATE_PASSWORD != '' && env.IOS_MOBILE_PROVISION != ''
        run: |
          npx tauri ios init --ci
          npx tauri icon app-icon.png
          # The Push Notifications entitlement as the profile allows it, and the export method the profile is for.
          signing=$(bash ios/prepare.sh)
          read -r method team <<<"$signing"
          echo "Team $team, export method $method"
          echo "IOS_EXPORT_METHOD=$method" >> "$GITHUB_ENV"
          # Tauri imports IOS_CERTIFICATE into a temporary keychain and signs manually with IOS_MOBILE_PROVISION.
          APPLE_DEVELOPMENT_TEAM="$team" npx tauri ios build --ci --export-method "$method"
          ipa=$(find src-tauri/gen/apple/build -name '*.ipa' | head -1)
          [ -n "$ipa" ] || { echo "no signed IPA"; find src-tauri/gen/apple/build -maxdepth 4; exit 1; }
          # Without aps-environment in what ships, Apple gives the app no push token: fail here, not on the phone.
          mkdir -p "$RUNNER_TEMP/check" && unzip -q "$ipa" -d "$RUNNER_TEMP/check"
          codesign -d --entitlements - --xml "$RUNNER_TEMP"/check/Payload/*.app > "$RUNNER_TEMP/entitlements.plist"
          grep -A1 aps-environment "$RUNNER_TEMP/entitlements.plist" || { echo "::error::The signed app has no aps-environment entitlement."; cat "$RUNNER_TEMP/entitlements.plist"; exit 1; }
          cp "$ipa" "$RUNNER_TEMP/DevDash-${TAG#app-v}.ipa"
          ls -la "$RUNNER_TEMP/DevDash-${TAG#app-v}.ipa"
      - name: Upload IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$RUNNER_TEMP"/DevDash-*.ipa --clobber --repo "$GITHUB_REPOSITORY"
      - name: Send to TestFlight
        if: env.IOS_EXPORT_METHOD == 'app-store-connect' && env.APP_STORE_CONNECT_KEY != '' && env.APP_STORE_CONNECT_KEY_ID != '' && env.APP_STORE_CONNECT_ISSUER_ID != ''
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$APP_STORE_CONNECT_KEY" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_"$APP_STORE_CONNECT_KEY_ID".p8
          xcrun altool --upload-app --type ios --file "$RUNNER_TEMP/DevDash-${TAG#app-v}.ipa" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
          rm -f ~/.appstoreconnect/private_keys/AuthKey_"$APP_STORE_CONNECT_KEY_ID".p8

  # Assemble the updater manifest once, after the platform builds, from the signed artifacts
  # that actually landed on the release. The repository is private, so each space serves it to
  # the installed app with its links rewritten (https://<space>/api/app/latest.json, server
  # modules/releases); the app checks every file against its built-in public key.
  manifest:
    needs: [windows, android]
    if: ${{ always() && (needs.windows.result == 'success' || needs.android.result == 'success') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Assemble and upload latest.json
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${TAG#app-v}"
          pub_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"

          # Read the names of the assets actually attached to this release, then fetch the .sig files.
          mapfile -t assets < <(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
          mkdir -p sigs
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.sig' --dir sigs --clobber || true
          pick() { printf '%s\n' "${assets[@]}" | grep -E "$1" | head -1 || true; }

          platforms='{}'

          # Windows: the NSIS installer the updater downloads, plus its signature.
          win_exe="$(pick '\-setup\.exe$')"
          win_sig="$(pick '\-setup\.exe\.sig$')"
          if [ -n "$win_exe" ] && [ -f "sigs/$win_sig" ]; then
            platforms="$(jq --arg url "$base/$win_exe" --rawfile sig "sigs/$win_sig" \
              '. + {"windows-x86_64": {signature: ($sig | rtrimstr("\n")), url: $url}}' <<<"$platforms")"
          fi

          # Android: the universal release APK + its signature, mapped to each ABI the universal
          # APK carries. (Tauri's updater is desktop-only today, so this is published for
          # completeness / future use rather than in-app auto-install on Android.)
          apk="$(pick '\.apk$')"
          apk_sig="$(pick '\.apk\.sig$')"
          if [ -n "$apk" ] && [ -f "sigs/$apk_sig" ]; then
            entry="$(jq -n --arg url "$base/$apk" --rawfile sig "sigs/$apk_sig" \
              '{signature: ($sig | rtrimstr("\n")), url: $url}')"
            platforms="$(jq --argjson e "$entry" \
              '. + {"android-aarch64": $e, "android-armv7": $e, "android-x86_64": $e, "android-i686": $e}' <<<"$platforms")"
          fi

          if [ "$platforms" = '{}' ]; then
            echo "No signed updater artifacts found on $TAG; refusing to write an empty latest.json." >&2
            exit 1
          fi

          jq -n --arg version "$version" --arg pub_date "$pub_date" --argjson platforms "$platforms" \
            '{version: $version, pub_date: $pub_date, platforms: $platforms}' > latest.json
          echo "--- latest.json ---"; cat latest.json
          gh release upload "$TAG" latest.json --clobber --repo "$GITHUB_REPOSITORY"
