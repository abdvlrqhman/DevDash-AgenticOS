# tmux config for DevDash terminals (tmux -L devdash). The web UI provides tabs, so tmux stays invisible.
# The agent re-applies this file on start, so changes reach tmux servers that are already running.
set -g prefix None
unbind C-b
set -g status off
# The browser terminal handles mouse, selection, right-click and scrollback natively.
set -g mouse off
# Draw in the outer terminal's normal screen, so its own scrollback fills up as output arrives.
set -ga terminal-overrides ",xterm-256color:smcup@:rmcup@"
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g window-size latest
set -g aggressive-resize on
set -sg escape-time 10
set -g set-clipboard on
set -g focus-events on
